    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {

      font-family: 'Arvo', serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    h1 {
      position: fixed;
      top: 40px;
      left: 60px;
      font-size: 52px;
      line-height: 1.1;
      color: white;
      text-shadow:
        0px 3px 0px #b2a98f,
        0px 14px 10px rgba(0,0,0,0.15),
        0px 24px 2px rgba(0,0,0,0.1),
        0px 34px 30px rgba(0,0,0,0.1);
      z-index: 10;
      pointer-events: none;
    }

    h1 .red { color: #e63946; }
    h1 .yellow { color: #f4d03f; }

    .keyBox {
      position: fixed;
      right: 40px;
      top: 60px;
      background: rgba(255,255,255,0.7);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      padding: 20px 24px;
      width: 160px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.12);
      z-index: 100;
    }

    .keyItem {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      font-size: 13px;
      color: #444;
    }

    .keyItem:last-child { margin-bottom: 0; }

    .keySwatch {
      width: 24px;
      height: 24px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .keySwatch.co2 { background: rgba(230,57,70,0.2); border: 2px solid #e63946; }
    .keySwatch.area { background: rgba(244,208,63,0.2); border: 2px solid #f4d03f; }
    .keySwatch.gas { border: 2px dashed #333; background: transparent; }
    .keySwatch.electric { border: 2px dotted #333; background: transparent; }

    .circles {
      position: relative;
      top: 0;
      left: 0;
      width: 100%;
      padding-top: 200px;
      padding-bottom: 80px;
    }

    .row {
      float: left;
      position: relative;
      height: 220px;
      width: 220px;
      margin: 30px 20px;
    }

    .co2Circles, .areaCircles {
      border-radius: 50%;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 1px 1px 19px rgba(50,50,50,0.2);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .co2Circles {
      border: 2px solid #e63946;
      background: rgba(230, 57, 70, 0.08);
    }

    .areaCircles {
      border: 2px solid #f4d03f;
      background: rgba(244, 208, 63, 0.08);
      cursor: pointer;
    }

    .areaCircles.Gas { border-style: dashed; }
    .areaCircles.Electric { border-style: dotted; }
    .co2Circles.Gas { border-style: dashed; }
    .co2Circles.Electric { border-style: dotted; }

    .areaCircles:hover {
      transform: translate(-50%, -50%) scale(1.05);
      box-shadow: 2px 2px 30px rgba(50,50,50,0.3);
      z-index: 50;
    }

    .infoHover {
      position: absolute;
      left: 110%;
      top: 0;
      width: 280px;
      background: white;
      border-radius: 12px;
      padding: 16px 20px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.15);
      font-family: 'Arvo', serif;
      font-size: 13px;
      line-height: 1.6;
      color: #333;
      z-index: 200;
      pointer-events: none;
    }

    .infoHover strong {
      display: block;
      font-size: 14px;
      margin-bottom: 6px;
      color: #111;
    }

    .map1 {
      margin-top: 12px;
      border-radius: 8px;
      overflow: hidden;
    }

    .map1 iframe {
      border: none;
      border-radius: 8px;
      width: 240px;
      height: 180px;
    }

    .clearfix::after { content: ''; display: table; clear: both; }
  </style>
</head>

      row.className = 'row';

      co2El.className = 'co2Circles ' + d.Fuel;
      co2El.style.width = co2Size + 'px';
      co2El.style.height = co2Size + 'px';
      row.appendChild(co2El);

      areaEl.className = 'areaCircles ' + d.Fuel;
      areaEl.style.width = areaSize + 'px';
      areaEl.style.height = areaSize + 'px';

      areaEl.addEventListener('mouseenter', function() {
        var overlay = document.createElement('div');
        overlay.className = 'infoHover';
        overlay.innerHTML =

          'Provider: ' + d.Provider + '<br>' +
          'Type: ' + d.building_subcategory + '<br>' +
          'Fuel: ' + d.Fuel + '<br>' +

          'Area: ' + areaParse.toLocaleString() + ' sq ft' +
          '<div class="map1"><iframe src="https://maps.google.com/?output=embed&q=' + encodeURIComponent(d.Location) + '&hl=en"></iframe></div>';
        areaEl.appendChild(overlay);
      });

      areaEl.addEventListener('mouseleave', function() {
        var overlay = areaEl.querySelector('.infoHover');
        if (overlay) areaEl.removeChild(overlay);
      });

      row.appendChild(areaEl);
      container.appendChild(row);
